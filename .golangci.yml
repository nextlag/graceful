version: "2"
run:
  concurrency: 4
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: true

linters:
  default: all
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - staticcheck
    - wsl_v5
    - contextcheck
    - copyloopvar
    - dupl
    - err113
    - errname
    - funlen
    - lll
    - noinlineerr
    - nlreturn
    - nilerr
    - nilnesserr
    - nilnil
    - perfsprint
    - nestif
  disable:
    - whitespace
  settings:
    wsl_v5:
      allow-first-in-block: false
      allow-whole-block: true
      branch-max-lines: 4
      case-max-lines: 2
      default: all
      enable:
        - assign
        - branch
        - decl
        - defer
        - expr
        - for
        - go
        - if
        - inc-dec
        - label
        - range
        - return
        - select
        - send
        - switch
        - type-switch
        - append
        - assign-exclusive
        - assign-expr
        - err
        - leading-whitespace
        - trailing-whitespace
    staticcheck:
      checks:
        - ST1003
        - ST1005
        - ST1006
        - ST1008
        - ST1011
        - ST1012
        - ST1013
        - ST1015
        - ST1016
        - ST1017
        - ST1018
        - ST1019
        - ST1020
        - ST1021
        - ST1022
        - ST1023
    varnamelen:
      ignore-names:
        - i
        - ok
        - bs
        - err
        - e
        - tx
        - id
        - wg
        - db
        - fn
        - in
        - tc
        - tt
        - t
    funlen:
      lines: 100
      statements: 50
      ignore-comments: true
    dupl:
      threshold: 100
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/nextlag/graceful
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - lll
        source: '.*// '
      - path: _test\.go
        linters:
          - exhaustruct
          - exhaustruct_v5
      - path: _test\.go
        linters:
          - gosec
        text: G204|G702
    paths:
      - "vendor"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true
  exclusions:
    generated: lax
    paths:
      - "vendor"